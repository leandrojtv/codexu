services:
  ollama:
    image: ollama/ollama:latest
    container_name: codexu-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull codellama:7b-instruct &&
       ollama list"
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  ollama_data:
