<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codexu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Codexu (M1)</h1>
      <button id="workspaceBtn">Selecionar workspace</button>
      <span id="workspaceLabel">Nenhum workspace selecionado</span>
    </header>

    <main class="grid">
      <section class="panel" id="chatPanel">
        <h2>Chat</h2>
        <div id="chatLog" class="scroll"></div>
        <form id="chatForm">
          <input id="chatInput" placeholder="Descreva sua tarefa..." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" />
          <button id="sendBtn" type="submit" disabled>Enviar</button>
        </form>
      </section>

      <section class="panel">
        <h2>Plan / Steps</h2>
        <ol id="planList">
          <li>Aguardando mensagem...</li>
        </ol>
      </section>

      <section class="panel">
        <h2>Diff Viewer</h2>
        <pre id="diffView" class="scroll">(sem diff ainda)</pre>
        <div class="actions">
          <button>Apply</button>
          <button>Reject</button>
        </div>
      </section>

      <section class="panel">
        <h2>Log / Console</h2>
        <pre id="logView" class="scroll">[init] app inicializado</pre>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
