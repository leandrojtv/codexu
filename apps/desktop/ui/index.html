<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codexu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="theme-dark">
    <header class="topbar">
      <div>
        <h1 id="appTitle">Codexu</h1>
        <div id="workspaceLabel">Nenhum workspace selecionado</div>
      </div>
      <div class="top-actions">
        <button id="workspaceBtn">Selecionar workspace</button>
        <button id="themeBtn">Tema</button>
      </div>
    </header>

    <div class="statusbar" id="statusBar">provider: - | latência: - | modelo: - | workspace: -</div>

    <main class="layout" id="layout">
      <section class="panel chat-col" id="chatPanel">
        <h2>Chat</h2>
        <div id="chatLog" class="scroll"></div>
        <form id="chatForm">
          <textarea id="chatInput" rows="3" placeholder="Digite sua mensagem..."></textarea>
          <button id="sendBtn" type="submit" disabled>Enviar</button>
        </form>
      </section>

      <section class="panel main-col">
        <h2>Plan / Steps</h2>
        <ol id="planList"><li>Aguardando...</li></ol>
        <h3>Preview</h3>
        <pre id="preview" class="scroll">(sem preview)</pre>
      </section>

      <section class="panel side-col">
        <div class="tabs">
          <button data-tab="diff" class="tab active">Diff</button>
          <button data-tab="logs" class="tab">Logs</button>
          <button data-tab="settings" class="tab">Settings</button>
        </div>

        <div id="tab-diff" class="tab-content active">
          <div class="row">
            <label>Modo:</label>
            <select id="diffMode">
              <option value="unified">Unified</option>
              <option value="side">Side-by-side</option>
            </select>
            <button id="applyDiffBtn">Apply</button>
            <button id="rejectDiffBtn">Reject</button>
          </div>
          <pre id="diffView" class="scroll">(sem diff)</pre>
        </div>

        <div id="tab-logs" class="tab-content">
          <div class="row">
            <select id="logFilter">
              <option value="all">all</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
            <button id="copyLogsBtn">Copiar logs</button>
          </div>
          <pre id="logView" class="scroll">[init] app inicializado</pre>
        </div>

        <div id="tab-settings" class="tab-content">
          <div class="settings-grid">
            <label>Provider</label><select id="provider"><option value="docker">Docker</option><option value="cloud">Cloud</option></select>
            <label>Docker endpoint</label><input id="dockerEndpoint" />
            <label>Cloud endpoint</label><input id="cloudEndpoint" />
            <label>Cloud API key</label><input id="cloudApiKey" type="password" />
            <label>Model</label><input id="modelName" />
            <label>Temperature</label><input id="temperature" type="number" step="0.1" />
            <label>Top P</label><input id="topP" type="number" step="0.05" />
            <label>Max tokens</label><input id="maxTokens" type="number" />
            <label>Timeout</label><input id="timeoutSecs" type="number" />
            <label>Retries</label><input id="retries" type="number" />
          </div>
          <button id="saveSettingsBtn">Salvar settings</button>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
